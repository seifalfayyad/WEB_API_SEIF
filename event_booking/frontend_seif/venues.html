<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Venue Management - Event Booking System</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .venues-main {
            min-width: 0;
            padding: 48px 58px;
        }

        .venues-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
            margin-bottom: 32px;
        }

        .venues-title {
            margin: 8px 0 0;
            font-family: "Sora", sans-serif;
            font-size: 46px;
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .venues-title span {
            color: var(--accent);
        }

        .venues-subtitle {
            margin: 12px 0 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .admin-card {
            min-width: 210px;
            padding: 16px 20px;
            border-radius: 18px;
            background: var(--lavender-strong);
        }

        .admin-card small {
            display: block;
            margin-bottom: 4px;
            color: var(--muted);
        }

        .venues-toolbar {
            display: grid;
            grid-template-columns: minmax(220px, 1fr) 190px 170px auto auto;
            gap: 12px;
            margin-bottom: 22px;
        }

        .venues-toolbar input,
        .venues-toolbar select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            background: white;
            color: var(--ink);
            outline: none;
        }

        .venues-toolbar input:focus,
        .venues-toolbar select:focus {
            border-color: var(--accent);
        }

        .toolbar-button,
        .add-venue-button {
            border: 0;
            border-radius: 999px;
            padding: 12px 18px;
            font-weight: 700;
        }

        .toolbar-button {
            background: var(--lavender-strong);
            color: var(--ink);
        }

        .add-venue-button {
            background: var(--accent);
            color: white;
        }

        .add-venue-button:hover {
            background: var(--accent-dark);
        }

        .venues-card {
            padding: 28px;
            border-radius: 26px;
            background: var(--paper);
            box-shadow: 0 10px 25px rgba(39, 39, 32, 0.04);
        }

        .venues-card-header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            margin-bottom: 18px;
        }

        .venues-card h2 {
            margin: 6px 0 0;
            font-family: "Sora", sans-serif;
            font-size: 24px;
        }

        .venue-table-wrap {
            overflow-x: auto;
        }

        .venue-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .venue-table th {
            padding: 0 14px 8px;
            text-align: left;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .venue-table td {
            padding: 15px 14px;
            background: #f8f6ff;
            font-size: 13px;
        }

        .venue-table td:first-child {
            border-radius: 14px 0 0 14px;
        }

        .venue-table td:last-child {
            border-radius: 0 14px 14px 0;
        }

        .venue-status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }

        .venue-status.available {
            background: #d9f2e5;
            color: #2f6f4e;
        }

        .venue-status.unavailable {
            background: var(--mauve-light);
            color: #8c405d;
        }

        .venue-actions {
            display: flex;
            gap: 8px;
        }

        .venue-edit,
        .venue-delete {
            border: 0;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
        }

        .venue-edit {
            background: var(--lavender-strong);
            color: var(--ink);
        }

        .venue-delete {
            background: var(--mauve-light);
            color: var(--ink);
        }

        .venue-alert {
            display: none;
            margin-bottom: 20px;
            padding: 14px 16px;
            border-radius: 14px;
            background: var(--lavender-strong);
        }

        .venue-alert.show {
            display: block;
        }

        .venue-pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
            color: var(--muted);
            font-size: 13px;
        }

        .venue-pagination button {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 8px 14px;
            background: white;
            color: var(--ink);
        }

        .venue-pagination button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .venue-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(30, 27, 46, 0.5);
        }

        .venue-modal.show {
            display: flex;
        }

        .venue-modal-card {
            width: min(620px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 26px;
            background: var(--paper);
            box-shadow: 0 25px 80px rgba(30, 27, 46, 0.18);
        }

        .venue-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }

        .venue-modal-header h2 {
            margin: 6px 0 0;
            font-family: "Sora", sans-serif;
        }

        .venue-close {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 50%;
            background: var(--lavender-strong);
            font-size: 22px;
        }

        .venue-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .venue-field {
            display: grid;
            gap: 8px;
        }

        .venue-field.full {
            grid-column: 1 / -1;
        }

        .venue-field label {
            font-size: 12px;
            font-weight: 700;
        }

        .venue-field input,
        .venue-field select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            background: white;
            color: var(--ink);
            outline: none;
        }

        .venue-field input:focus,
        .venue-field select:focus {
            border-color: var(--accent);
        }

        .save-venue-button {
            width: 100%;
            margin-top: 20px;
            border: 0;
            border-radius: 999px;
            padding: 14px 18px;
            background: var(--accent);
            color: white;
            font-weight: 700;
        }

        .save-venue-button:hover {
            background: var(--accent-dark);
        }

        #venueFormMessage {
            min-height: 18px;
            margin: 16px 0 0;
            color: #b14d65;
            font-size: 13px;
            font-weight: 600;
        }

        @media (max-width: 1100px) {
            .venues-toolbar {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 800px) {
            .venues-main {
                padding: 30px 22px;
            }

            .venues-header {
                flex-direction: column;
            }

            .venues-title {
                font-size: 36px;
            }

            .venues-toolbar,
            .venue-form-grid {
                grid-template-columns: 1fr;
            }

            .venue-field.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="dashboard-page">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <div class="brand-circle">E</div>
            <span>Event Booking</span>
        </div>

<nav class="sidebar-nav">

    <button
        class="nav-item"
        onclick="goToDashboard()"
    >
        Dashboard
    </button>

    <button
        class="nav-item"
        onclick="goToUsers()"
    >
        Users
    </button>

    <button
        class="nav-item active"
        onclick="goToVenues()"
    >
        Venues
    </button>

    <button
        class="nav-item"
        onclick="goToEvents()"
    >
        Events
    </button>

    <button
        class="nav-item"
        onclick="goToBookings()"
    >
        Bookings
    </button>

</nav>

        <button class="logout-button" onclick="logout()">
            Logout
        </button>

    </aside>


    <main class="venues-main">

        <header class="venues-header">

            <div>
                <div class="dashboard-eyebrow">
                    EVENT BOOKING SYSTEM
                </div>

                <h1 class="venues-title">
                    Manage <span>Venues</span>
                </h1>

                <p class="venues-subtitle">
                    Create and manage venue locations, capacity and availability.
                </p>
            </div>

            <div class="admin-card">
                <small>Administrator</small>
                <strong id="adminName">Admin User</strong>
            </div>

        </header>


        <div id="alertBox" class="venue-alert"></div>


        <div class="venues-toolbar">

            <input
                id="searchInput"
                type="text"
                placeholder="Search venue or location"
            >

            <select id="statusFilter">
                <option value="">All statuses</option>
                <option value="Available">Available</option>
                <option value="Unavailable">Unavailable</option>
            </select>

            <input
                id="capacityFilter"
                type="number"
                min="1"
                placeholder="Min capacity"
            >

            <button
                id="refreshButton"
                class="toolbar-button"
            >
                Refresh
            </button>

            <button
                id="newVenueButton"
                class="add-venue-button"
            >
                + Add Venue
            </button>

        </div>


        <section class="venues-card">

            <div class="venues-card-header">

                <div>
                    <div class="card-label">
                        VENUE RECORDS
                    </div>

                    <h2>
                        Venue List
                    </h2>
                </div>

            </div>


            <div class="venue-table-wrap">

                <table class="venue-table">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Venue</th>
                            <th>Location</th>
                            <th>Capacity</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="venuesTable">

                        <tr>
                            <td colspan="6">
                                Loading venues...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>


            <div
                id="pagination"
                class="venue-pagination"
            ></div>

        </section>

    </main>

</div>


<div
    id="venueModal"
    class="venue-modal"
>

    <div class="venue-modal-card">

        <div class="venue-modal-header">

            <div>
                <div class="card-label">
                    VENUE MANAGEMENT
                </div>

                <h2 id="modalTitle">
                    Add Venue
                </h2>
            </div>

            <button
                type="button"
                class="venue-close"
                onclick="closeVenueModal()"
            >
                ×
            </button>

        </div>


        <form id="venueForm">

            <input
                type="hidden"
                id="venueId"
            >


            <div class="venue-form-grid">

                <div class="venue-field">

                    <label for="venueName">
                        Venue Name
                    </label>

                    <input
                        id="venueName"
                        maxlength="100"
                        required
                        placeholder="Enter venue name"
                    >

                </div>


                <div class="venue-field">

                    <label for="capacity">
                        Capacity
                    </label>

                    <input
                        id="capacity"
                        type="number"
                        min="1"
                        required
                        placeholder="e.g. 300"
                    >

                </div>


                <div class="venue-field full">

                    <label for="location">
                        Location
                    </label>

                    <input
                        id="location"
                        maxlength="255"
                        required
                        placeholder="Enter venue location"
                    >

                </div>


                <div class="venue-field full">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="Available">
                            Available
                        </option>

                        <option value="Unavailable">
                            Unavailable
                        </option>

                    </select>

                </div>

            </div>


            <p id="venueFormMessage"></p>


            <button
                type="submit"
                class="save-venue-button"
            >
                Save Venue
            </button>

        </form>

    </div>

</div>


<script>

    const API =
        "../backend/venues.php";


    const token =
        localStorage.getItem("token");


    const user =
        JSON.parse(
            localStorage.getItem("user") || "null"
        );


    if (
        !token ||
        !user ||
        user.role !== "Administrator"
    ) {

        window.location.href =
            "login.html";

    }


    const headers = {
        "Content-Type":
            "application/json",

        "Authorization":
            "Bearer " + token
    };


    let page = 1;


    document
        .getElementById("adminName")
        .textContent =
        user?.name || "Admin User";


    function escapeHtml(value) {

        return String(value ?? "")
            .replace(
                /[&<>"']/g,
                char => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[char])
            );

    }


    function showAlert(message) {

        const box =
            document.getElementById(
                "alertBox"
            );

        box.textContent =
            message;

        box.classList.add(
            "show"
        );

    }


    function queryString() {

        const params =
            new URLSearchParams({
                page,
                limit: 10
            });


        const search =
            document
                .getElementById(
                    "searchInput"
                )
                .value
                .trim();


        const status =
            document
                .getElementById(
                    "statusFilter"
                )
                .value;


        const capacity =
            document
                .getElementById(
                    "capacityFilter"
                )
                .value;


        if (search) {
            params.set(
                "search",
                search
            );
        }


        if (status) {
            params.set(
                "status",
                status
            );
        }


        if (capacity) {
            params.set(
                "min_capacity",
                capacity
            );
        }


        return params;
    }


    async function loadVenues() {

        try {

            const response =
                await fetch(
                    `${API}?${queryString()}`,
                    {
                        headers
                    }
                );


            if (
                response.status === 401 ||
                response.status === 403
            ) {

                localStorage.clear();

                window.location.href =
                    "login.html";

                return;
            }


            const result =
                await response.json();


            if (
                !response.ok ||
                result.success !== true
            ) {

                throw new Error(
                    result.message ||
                    "Unable to load venues."
                );

            }


            const venues =
                result.data || [];


            const table =
                document.getElementById(
                    "venuesTable"
                );


            table.innerHTML =
                venues.length
                    ? venues.map(
                        venue => `

                        <tr>

                            <td>
                                ${venue.venue_id}
                            </td>

                            <td>
                                <strong>
                                    ${escapeHtml(venue.venue_name)}
                                </strong>
                            </td>

                            <td>
                                ${escapeHtml(venue.location)}
                            </td>

                            <td>
                                ${Number(venue.capacity).toLocaleString()}
                            </td>

                            <td>
                                <span class="
                                    venue-status
                                    ${venue.status === "Available"
                                        ? "available"
                                        : "unavailable"}
                                ">
                                    ${escapeHtml(venue.status)}
                                </span>
                            </td>

                            <td>

                                <div class="venue-actions">

                                    <button
                                        class="venue-edit"
                                        onclick="editVenue(${venue.venue_id})"
                                    >
                                        Edit
                                    </button>

                                    <button
                                        class="venue-delete"
                                        onclick="deleteVenue(${venue.venue_id})"
                                    >
                                        Delete
                                    </button>

                                </div>

                            </td>

                        </tr>

                    `
                    ).join("")
                    : `

                        <tr>

                            <td colspan="6">
                                No venues found.
                            </td>

                        </tr>

                    `;


            renderPagination(
                result.pagination || {}
            );


        } catch (error) {

            showAlert(
                error.message
            );

        }
    }


    function renderPagination(
        pagination
    ) {

        const container =
            document.getElementById(
                "pagination"
            );


        const totalPages =
            Number(
                pagination.totalPages || 0
            );


        if (totalPages <= 1) {

            container.innerHTML =
                `<span>
                    ${pagination.total ?? 0}
                    venue(s)
                </span>`;

            return;
        }


        container.innerHTML = `

            <button
                id="previousPage"
                ${page <= 1
                    ? "disabled"
                    : ""}
            >
                Previous
            </button>

            <span>
                Page ${page}
                of ${totalPages}
            </span>

            <button
                id="nextPage"
                ${page >= totalPages
                    ? "disabled"
                    : ""}
            >
                Next
            </button>

        `;


        document
            .getElementById(
                "previousPage"
            )
            ?.addEventListener(
                "click",
                () => {

                    page--;

                    loadVenues();

                }
            );


        document
            .getElementById(
                "nextPage"
            )
            ?.addEventListener(
                "click",
                () => {

                    page++;

                    loadVenues();

                }
            );

    }


    function openVenueModal(
        venue = null
    ) {

        document
            .getElementById(
                "venueForm"
            )
            .reset();


        document
            .getElementById(
                "venueFormMessage"
            )
            .textContent = "";


        document
            .getElementById(
                "venueId"
            )
            .value =
            venue?.venue_id || "";


        document
            .getElementById(
                "modalTitle"
            )
            .textContent =
            venue
                ? "Edit Venue"
                : "Add Venue";


        if (venue) {

            document
                .getElementById(
                    "venueName"
                )
                .value =
                venue.venue_name;


            document
                .getElementById(
                    "location"
                )
                .value =
                venue.location;


            document
                .getElementById(
                    "capacity"
                )
                .value =
                venue.capacity;


            document
                .getElementById(
                    "status"
                )
                .value =
                venue.status;

        }


        document
            .getElementById(
                "venueModal"
            )
            .classList
            .add("show");

    }


    function closeVenueModal() {

        document
            .getElementById(
                "venueModal"
            )
            .classList
            .remove("show");

    }


    async function editVenue(id) {

        try {

            const response =
                await fetch(
                    `${API}?id=${id}`,
                    {
                        headers
                    }
                );


            const result =
                await response.json();


            if (
                !response.ok ||
                result.success !== true
            ) {

                throw new Error(
                    result.message ||
                    "Unable to load venue."
                );

            }


            openVenueModal(
                result.data
            );


        } catch (error) {

            showAlert(
                error.message
            );

        }
    }


    async function deleteVenue(id) {

        if (
            !confirm(
                "Delete this venue? Venues assigned to events cannot be deleted."
            )
        ) {
            return;
        }


        try {

            const response =
                await fetch(
                    `${API}?id=${id}`,
                    {
                        method: "DELETE",
                        headers
                    }
                );


            const result =
                await response.json();


            if (
                !response.ok ||
                result.success !== true
            ) {

                throw new Error(
                    result.message ||
                    "Unable to delete venue."
                );

            }


            showAlert(
                result.message
            );


            loadVenues();


        } catch (error) {

            showAlert(
                error.message
            );

        }
    }


    document
        .getElementById(
            "venueForm"
        )
        .addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const id =
                    document
                        .getElementById(
                            "venueId"
                        )
                        .value;


                const data = {

                    venue_name:
                        document
                            .getElementById(
                                "venueName"
                            )
                            .value
                            .trim(),

                    location:
                        document
                            .getElementById(
                                "location"
                            )
                            .value
                            .trim(),

                    capacity:
                        Number(
                            document
                                .getElementById(
                                    "capacity"
                                )
                                .value
                        ),

                    status:
                        document
                            .getElementById(
                                "status"
                            )
                            .value
                };


                try {

                    const response =
                        await fetch(
                            id
                                ? `${API}?id=${id}`
                                : API,
                            {
                                method:
                                    id
                                        ? "PUT"
                                        : "POST",

                                headers,

                                body:
                                    JSON.stringify(
                                        data
                                    )
                            }
                        );


                    const result =
                        await response.json();


                    if (
                        !response.ok ||
                        result.success !== true
                    ) {

                        throw new Error(
                            result.message ||
                            "Unable to save venue."
                        );

                    }


                    closeVenueModal();


                    showAlert(
                        result.message
                    );


                    loadVenues();


                } catch (error) {

                    document
                        .getElementById(
                            "venueFormMessage"
                        )
                        .textContent =
                        error.message;

                }

            }
        );


    document
        .getElementById(
            "newVenueButton"
        )
        .addEventListener(
            "click",
            () => openVenueModal()
        );


    document
        .getElementById(
            "refreshButton"
        )
        .addEventListener(
            "click",
            loadVenues
        );


    document
        .getElementById(
            "searchInput"
        )
        .addEventListener(
            "input",
            () => {

                page = 1;

                loadVenues();

            }
        );


    document
        .getElementById(
            "statusFilter"
        )
        .addEventListener(
            "change",
            () => {

                page = 1;

                loadVenues();

            }
        );


    document
        .getElementById(
            "capacityFilter"
        )
        .addEventListener(
            "change",
            () => {

                page = 1;

                loadVenues();

            }
        );


    function goToDashboard() {
        window.location.href = "dashboard.html";
    }

    function goToUsers() {
        window.location.href = "users.html";
    }

    function goToVenues() {
        window.location.href = "venues.html";
    }

    function goToEvents() {
        window.location.href = "events.html";
    }

    function goToBookings() {
        window.location.href = "booking.html";
    }


    function logout() {

        localStorage.removeItem(
            "token"
        );

        localStorage.removeItem(
            "user"
        );

        window.location.href =
            "login.html";

    }


    loadVenues();

</script>

</body>
</html>
