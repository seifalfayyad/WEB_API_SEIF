<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Event Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard-page">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-circle">E</div>
            <span>Event Booking</span>
        </div>

        <nav class="sidebar-nav">
            <button class="nav-item active">
                Dashboard
            </button>

            <button class="nav-item" onclick="goToEvents()">
                Events
            </button>
        </nav>

        <button class="logout-button" onclick="logout()">
            Logout
        </button>
    </aside>


    <main class="dashboard-main">

        <header class="dashboard-header">

            <div>
                <p class="dashboard-eyebrow">
                    EVENT BOOKING SYSTEM
                </p>

                <h1 class="dashboard-title">
                    Welcome back,
                    <span id="userName">User</span>.
                </h1>
            </div>

            <div class="user-badge">
                <span id="userInitial">U</span>
            </div>

        </header>


        <section class="welcome-card">

            <div>
                <p class="card-label">
                    YOUR ROLE
                </p>

                <h2 id="userRole">
                    Loading...
                </h2>

                <p id="roleDescription">
                    Loading your dashboard...
                </p>
            </div>

            <div class="welcome-decoration">
                ↗
            </div>

        </section>


        <section class="dashboard-section">

            <div class="section-heading">
                <div>
                    <p class="card-label">QUICK ACCESS</p>
                    <h2>What would you like to do?</h2>
                </div>
            </div>

            <div id="dashboardActions" class="action-grid"></div>

        </section>

    </main>

</div>

<script src="app.js"></script>

<script>
    loadDashboard();
</script>

</body>
</html>
